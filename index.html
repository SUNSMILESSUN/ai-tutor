<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --border:#e4e7eb; --text:#1f2329; --muted:#8a9099;
    --primary:#3370ff; --primary-hover:#245bdb;
    --c-unlearned:#f5f5f5; --c-learned:#d4edda; --c-r1:#cce5ff; --c-r2:#b3d9ff;
    --c-r3:#a3bffa; --c-r4:#9966ff; --c-important:#ffd6d6;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* 顶部工具栏 */
  .toolbar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbar .title{font-weight:600;font-size:15px;margin-right:8px;white-space:nowrap}
  .toolbar .stats{font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
  .toolbar .group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .toolbar button,.toolbar select,.toolbar input[type=text]{font-size:12px;padding:4px 8px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;height:26px}
  .toolbar button:hover{background:#f0f2f5}
  .toolbar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .toolbar input[type=text]{width:140px}
  .toolbar input[type=range]{width:90px}
  .toolbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .spacer{flex:1}
  /* 主体 */
  .main{flex:1 1 auto;overflow:auto;position:relative}
  .tree-wrap{padding:12px;transform-origin:top left;transition:transform .15s ease}
  /* 树节点 */
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
  ul.tree ul{margin-left:18px;border-left:1px dashed #dfe2e6;padding-left:8px}
  .node{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;margin:1px 0;flex-wrap:wrap;min-height:26px}
  .node:hover{background:#eef2ff}
  .node .arrow{cursor:pointer;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);user-select:none;flex:0 0 auto}
  .node .arrow.empty{visibility:hidden}
  .node .arrow.collapsed::after{content:"▶";font-size:9px}
  .node .arrow.expanded::after{content:"▼";font-size:9px}
  .node .chk{cursor:pointer;flex:0 0 auto}
  .node .review-btn{font-size:11px;padding:1px 6px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;flex:0 0 auto}
  .node .review-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
  .node .title{cursor:pointer;flex:1 1 auto;min-width:80px;word-break:break-word}
  .node .badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#eef2ff;color:var(--primary);flex:0 0 auto}
  .node .badge.r0{background:transparent;color:transparent}
  .node .badge.r1{background:#cce5ff;color:#0066cc}
  .node .badge.r2{background:#b3d9ff;color:#0052a3}
  .node .badge.r3{background:#a3bffa;color:#3b2a8a}
  .node .badge.r4{background:#9966ff;color:#fff}
  .node .meta{font-size:10px;color:var(--muted);flex:0 0 auto}
  .node .stage-tag{font-size:10px;color:var(--muted);background:#f0f2f5;padding:1px 5px;border-radius:3px;flex:0 0 auto}
  /* 状态颜色（行背景） */
  .node.state-unlearned{background:var(--c-unlearned)}
  .node.state-learned{background:var(--c-learned)}
  .node.state-r1{background:var(--c-r1)}
  .node.state-r2{background:var(--c-r2)}
  .node.state-r3{background:var(--c-r3)}
  .node.state-r4{background:var(--c-r4);color:#fff}
  .node.state-r4 .meta,.node.state-r4 .stage-tag{color:#eee}
  .node.important{box-shadow:inset 0 0 0 1px var(--bad)}
  .node.match{outline:2px solid var(--primary);outline-offset:-1px}
  .node.hidden{display:none}
  /* 阶段分组 */
  .stage-block{margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .stage-header{padding:8px 12px;background:#f0f4ff;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;border-bottom:1px solid var(--border)}
  .stage-header .stage-meta{font-weight:400;font-size:11px;color:var(--muted)}
  .stage-body{padding:8px}
  /* 进度条 */
  .progress-bar{height:4px;background:#eee;border-radius:2px;overflow:hidden;flex:1;min-width:60px;max-width:120px}
  .progress-bar .fill{height:100%;background:var(--ok);transition:width .3s}
  /* 移动端 */
  @media (max-width:768px){
    .toolbar{padding:6px 8px;gap:6px}
    .toolbar .title{font-size:14px}
    .toolbar button,.toolbar select,.toolbar input[type=text]{font-size:11px;padding:3px 6px;height:24px}
    .toolbar input[type=text]{width:100px}
    .toolbar input[type=range]{width:70px}
    .toolbar .stats{display:none}
    .tree-wrap{padding:6px}
    ul.tree ul{margin-left:12px}
    .node .meta{display:none}
    .node .stage-tag{display:none}
  }
  @media (max-width:480px){
    .toolbar label{display:none}
    .toolbar .group.zoom-group{display:none}
  }
  /* 浮动统计卡 */
  .float-stats{position:fixed;bottom:12px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:100;max-width:200px}
  .float-stats .row{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
  .float-stats .label{color:var(--muted)}
  .float-stats .val{font-weight:600}
  /* 图例 */
  .legend{position:fixed;bottom:12px;left:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;z-index:100;display:flex;gap:8px;flex-wrap:wrap;max-width:50vw}
  .legend .item{display:flex;align-items:center;gap:4px}
  .legend .swatch{width:12px;height:12px;border-radius:2px;border:1px solid #ddd}
  @media (max-width:768px){.legend{display:none}.float-stats{max-width:160px}}
  /* 同步状态条 */
  .sync-group{display:flex;gap:4px;align-items:center}
  .sync-status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;border:1px solid var(--border)}
  .sync-status.idle{background:#f0f2f5;color:var(--muted)}
  .sync-status.syncing{background:#e6f4ff;color:var(--primary);border-color:var(--primary)}
  .sync-status.synced{background:#d4edda;color:var(--ok);border-color:var(--ok)}
  .sync-status.failed{background:#f8d7da;color:var(--bad);border-color:var(--bad)}
  .sync-status.offline{background:#fff3cd;color:var(--warn);border-color:var(--warn)}
  .sync-toast{position:fixed;top:60px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:200;display:none;max-width:300px}
  .sync-toast.show{display:block}
  @media (max-width:480px){.sync-status{max-width:80px;overflow:hidden;text-overflow:ellipsis}}
</style>

": []}, {"id": "n_0bd50bba33", "title": "正确的写法", "level": 5, "children": [{"id": "n_56cc0882d3", "title": "# 用这种方式，强制限定必须完成 烧水2 和 磨咖啡豆 这两个动作后才能 冲咖啡 ，这才是我们想要的执行流程\n    graphBuilder.add_edge([\"烧水2\",\"磨咖啡豆\"], \"冲咖啡\")", "level": 6, "children": []}]}]}, {"id": "n_d356afbc65", "title": "人工介入", "level": 4, "children": [{"id": "n_df327798e0", "title": "(未命名)", "level": 5, "children": []}, {"id": "n_7264f921f1", "title": "graph必须带有memory", "level": 5, "children": [{"id": "n_a0db34d893", "title": "checkpointer = InMemorySaver()", "level": 6, "children": []}, {"id": "n_df5f415552", "title": "graph = graphBuilder.compile(checkpointer=checkpointer)", "level": 6, "children": []}]}, {"id": "n_9d270ad1e1", "title": "首次启动", "level": 5, "children": [{"id": "n_dba2cb42fd", "title": "state = graph.invoke(state, config)  # 调用Agent启动工作流", "level": 6, "children": []}]}, {"id": "n_2279fafd07", "title": "打断", "level": 5, "children": [{"id": "n_ac93e6b3f3", "title": "def 询问是否加糖(state):\n    human_response = interrupt({'':''})\n    state[\"是否加糖\"] = human_response\n    return state", "level": 6, "children": []}]}, {"id": "n_00e2e3c7c3", "title": "再次启动", "level": 5, "children": [{"id": "n_d64e6d5367", "title": "userDecision = input(\"先生您好，请问您的咖啡需要加糖吗？(是/否):\")\n    while userDecision not in {\"是\", \"否\"}:\n        userDecision = input(\"先生您好，请问您的咖啡需要加糖吗？(是/否):\")\n\n    result = graph.invoke(Command(resume=userDecision), config=config)", "level": 6, "children": []}]}]}, {"id": "n_c0e559d67a", "title": "子图", "level": 4, "children": [{"id": "n_5b43c03552", "title": "有些图会过于复杂", "level": 5, "children": [{"id": "n_11dfcbc488", "title": "(未命名)", "level": 6, "children": []}]}, {"id": "n_71e5c3818d", "title": "可以考虑拆解成子图", "level": 5, "children": [{"id": "n_8a8158d8fc", "title": "(未命名)", "level": 6, "children": [{"id": "n_e2337698b5", "title": "(未命名)", "level": 7, "children": []}, {"id": "n_5644ef505e", "title": "(未命名)", "level": 7, "children": []}]}]}, {"id": "n_896968d604", "title": "实现方式", "level": 5, "children": [{"id": "n_43eb44c8c1", "title": "#总图\n    graphBuilder = StateGraph(State)\n    graphBuilder.add_node(\"得到热水子图\",heatWaterSubGraph)\n    graphBuilder.add_node(\"磨咖啡豆\", 磨咖啡豆)\n    graphBuilder.add_node(\"冲咖啡\", 冲咖啡)\n    graphBuilder.add_node(\"加糖子图\", addSugurSubGraph)\n    graphBuilder.add_edge(START,\"得到热水子图\")\n    graphBuilder.add_edge(START, \"磨咖啡豆\")\n    graphBuilder.add_edge([\"得到热水子图\",\"磨咖啡豆\"],\"冲咖啡\")\n    graphBuilder.add_edge(\"冲咖啡\",\"加糖子图\")\n    graph = graphBuilder.compile(checkpointer=checkpointer)\n    return heatWaterSubGraph,addSugurSubGraph,graph", "level": 6, "children": [{"id": "n_4579153f14", "title": "#烧水子图\n    heatWaterSubGraphBuilder = StateGraph(State)\n    heatWaterSubGraphBuilder.add_node(\"heat water\", 烧水)\n    heatWaterSubGraphBuilder.add_node(\"get boil water\", 得到开水)\n    heatWaterSubGraphBuilder.add_edge(START, \"heat water\")\n    heatWaterSubGraphBuilder.add_edge(START, \"heat water\")\n    heatWaterSubGraphBuilder.add_conditional_edges(\"heat water\", 按温度处理水,{\"水烧开了\": \"get boil water\", \"水没开\": \"heat water\"})\n    heatWaterSubGraph = heatWaterSubGraphBuilder.compile()", "level": 7, "children": []}, {"id": "n_f35f69093e", "title": "#加糖子图\n    checkpointer = InMemorySaver()\n    addSugurSubGraphBuilder = StateGraph(State)\n    addSugurSubGraphBuilder.add_node(\"询问是否加糖1\", 询问是否加糖)\n    addSugurSubGraphBuilder.add_node(\"加糖\", 加糖)\n    addSugurSubGraphBuilder.add_edge(START,\"询问是否加糖1\")\n    addSugurSubGraphBuilder.add_conditional_edges(\"询问是否加糖1\", 是否加糖分支, {\"是\": \"加糖\", \"否\": END})\n    addSugurSubGraph = addSugurSubGraphBuilder.compile(checkpointer=checkpointer)", "level": 7, "children": []}]}]}]}]}, {"id": "n_ed7a86a09e", "title": "实操：完成流程控制部分的代码，并测试效果", "level": 3, "children": []}]}, {"id": "n_364d9deccb", "title": "4. 使用langGraph完成新车型设计方案", "level": 2, "children": [{"id": "n_06a0d2e07a", "title": "交付能力：能够综合运用langGraph的知识，完成一个中等复杂度的项目为企业提供新车型设计方案", "level": 3, "children": []}, {"id": "n_aefeba63 ": "n_6e3d610221", "title": "大参数量模型+概要设计+分章节输出", "level": 5, "children": []}]}, {"id": "n_51631a2a93", "title": "方案一 小参数量模型+整体输出", "level": 4, "children": [{"id": "n_93f5cc2660", "title": "试验一  最简代码", "level": 5, "children": [{"id": "n_57522fca19", "title": "能产出但质量较差", "level": 6, "children": []}, {"id": "n_0e345839c3", "title": "车型没有名称", "level": 6, "children": []}, {"id": "n_a206f697ed", "title": "长度太短，不够详细", "level": 6, "children": []}]}, {"id": "n_91626b870b", "title": "试验二 增加车型名称", "level": 5, "children": []}, {"id": "n_e0c8f7d10d", "title": "试验三 增加方案长度", "level": 5, "children": [{"id": "n_83ce24c2c1", "title": "所需9章内容没有扩展", "level": 6, "children": []}, {"id": "n_e51de946a5", "title": "增加了一批不需要的章节", "level": 6, "children": []}]}]}, {"id": "n_fd2f8272c7", "title": "方案二 大参数量模型+整体输出", "level": 4, "children": [{"id": "n_c3643c95fd", "title": "产出效果较好", "level": 5, "children": []}, {"id": "n_c40f1f6914", "title": "不方便对各章节进行细节控制，后续升级不便", "level": 5, "children": []}]}, {"id": "n_3051312b9f", "title": "方案三 大参数量模型+分章节输出", "level": 4, "children": [{"id": "n_5ae8819f5f", "title": "分别生成的各章内容有冲突", "level": 5, "children": []}]}, {"id": "n_a59423ac71", "title": "方案四", "level": 4, "children": [{"id": "n_0de086512d", "title": "(未命名)", "level": 5, "children": []}, {"id": "n_9027c6fc43", "title": "主要步骤", "level": 5, "children": [{"id": "n_d99acb9572", "title": "信息收集", "level": 6, "children": [{"id": "n_abe1a8b0d3", "title": "实际项目中的市场趋势来自向量库检索结果", "level": 7, "children": []}, {"id": "n_c705213e4d", "title": "实际项目中的竞品销量数据来自关系数据库", "level": 7, "children": []}]}, {"id": "n_d52afa7a44", "title": "调用大参数量模型", "level": 6, "children": [{"id": "n_ca3ce60265", "title": "自己实现一个调用类，继承自Runnable", "level": 7, "children": [{"id": "n_05b8524076", "title": "class CustomModel(Runnable):\n    def __init__(self, model_endpoint: str, api_key: str):\n        self.endpoint = model_endpoint\n        self.api_key = api_key\n\n    def invoke(self, prompt: str, modelName:str=\"deepseek-ai/DeepSeek-V3\",maxTokens:int=3000,tempreture=0.6,config: Optional[Dict] = None) -> Dict:\n        \"\"\"调用自定义模型API\"\"\"\n        import requests\n\n        headers = {\"Authorization\": f\"Bearer {self.api_key}\",\n                   \"Content-Type\": \"application/json\"}\n        payload = {\n            \"model\":modelName,\n            \"messages\": [{\"role\": \"user\", \"content\": prompt}],\n            \"temperature\":tempreture,\n            \"max_tokens\": maxTokens\n        }\n        response = requests.post(self.endpoint, json=payload, headers=headers)\n        response.raise_for_status()\n        return response.json()['choices'][0]['message']['content']", "level": 8, "children": [{"id": "n_f6e03c6ca0", "title": "细分主题 1", "level": 9, "children": []}]}]}, {"id": "n_fe362008b2", "title": "封装成模型", "level": 7, "children": [{"id": "n_9f3025d658", "title": "llm = CustomModel(\n        model_endpoint=\"https://api.siliconflow.cn/v1/chat/completions\",\n        api_key=\"*****\"\n    )", "level": 8, "children": []}]}, {"id": "n_a1332fa586", "title": "调用", "level": 7, "children": [{"id": "n_58817af044", "title": "result = llm.invoke(prompt)", "level": 8, "children": []}]}]}, {"id": "n_2cb3d37f29", "title": "生成新车型的基本设定", "level": 6, "children": [{"id": "n_93b6e49a65", "title": "prompt = \"\"\"你是凯瑞汽车旗下维多利亚品牌的车型设计师，维多利亚品牌主要面向年轻的女性客户，根据【竞品资料】和【女性汽车市场发展趋势】，结合你自己的思考，为维多利亚品牌设计一款新车型，规划这个新车型、技术方案和定价策略。300字以内。\n\n    【竞品资料】\n    \"\"\" + state[\"competitorStatus\"] + \"\"\"\n\n    【女性汽车市场发展趋势】\n    \"\"\" + state[\"femaleMarketTrend\"]", "level": 7, "children": []}]}, {"id": "n_6840bca4c7", "title": "分别完成各个章节", "level": 6, "children": [{"id": "n_5acf04b62e", "title": "prompt = \"\"\"你是凯瑞汽车旗下维多利亚品牌的车型设计师，维多利亚品牌主要面向年轻的女性客户，根据【女性汽车市场发展趋势】和【新车型基本设定】，结合你自己的思考，完成新车型设计方案的第一章“一、设计背景和理念”，说明新车型的设计背景和理念。各级标题使用markdown格式。600字以内。\n\n    【女性汽车市场发展趋势】\n    \"\"\" + state[\"femaleMarketTrend\"]+\"\"\"\n    \n    【新车型基本设定】\n    \n    \"\"\"+state[\"basicSettings\"]", "level": 7, "children": []}]}, {"id": " _output(Sections)\n    result = planner.invoke(\"\"\"你是一位著名小说家，正在创作一部精彩的侦探小说，根据下面的【故事梗概】，将小说分成10个章节，并给出章节的剧情发展。1000字左右。\n                            【故事梗概】\n                            \"\"\"+state[\"storyLine\"])\n    state[\"sections\"] = result.sections\n    print(\"sections  \" + \"*\" * 80)\n    for section in state[\"sections\"]:\n        print(str(section.name+'        '+section.description))\n    return state", "level": 6, "children": []}, {"id": "n_7313247d18", "title": "def work(state:WorkerState):\n    prompt = \"\"\"你是一位著名小说家，正在创作一部精彩的侦探小说，根据下面提供的【章节标题】和【章节概述】，完成其中的一个章节，最前面是章节标题，后面是章节内容。章节标题采用“【第三章】 迷雾重现”的形式，单独一行。章节的序号为\"\"\"+str(state[\"section\"].num)+\"\"\",本章节长度1500字左右\n    \n    【章节标题】\n    \"\"\"+state[\"section\"].name+\"\"\"\n    \n    【章节概述】\n    \"\"\"+state[\"section\"].description\n    result = llm.invoke(prompt)\n    return {\"num\":state[\"section\"].num,\"name\":state[\"section\"].name,\"description\":state[\"section\"].description,\"completedSections\":[{\"num\":state[\"section\"].num,\"content\":result.content}]}", "level": 6, "children": []}, {"id": "n_48cb449b95", "title": "def synthesizer(state):\n    completedSections = sorted(state[\"completedSections\"],key=lambda completeSection:completeSection[\"num\"])\n    novel = \"\\n\\n\".join([completeSection[\"content\"] for completeSection in completedSections])\n    state[\"novel\"] = novel\n    return state", "level": 6, "children": []}]}, {"id": "n_479a7e614a", "title": "生成-评估", "level": 5, "children": [{"id": "n_de7597185e", "title": "(未命名)", "level": 6, "children": []}, {"id": "n_73e030d6c1", "title": "先生成，后评估，迭代提升", "level": 6, "children": []}, {"id": "n_a7d382c21e", "title": "def generate(state):\n    if state.get(\"feedback\"):\n        prompt = \"\"\"根据提供的主题写一篇论证文章。确保文章逻辑严密、有说服力。\n        主题为\"\"\"+state[\"topic\"]+\"\"\"\n        同时你需要考虑如下的修改建议：\"\"\"+state[\"feedback\"]\n    else:\n        prompt = \"\"\"根据提供的主题写一篇论证文章。确保文章逻辑严密、有说服力。\n                主题为\"\"\" + state[\"topic\"]\n        prompt = \"\"\"你是一位小学生，完全不会写作文，现在需要你写一篇论证文章。\n                 主题为\"\"\" + state[\"topic\"]\n    result = llm.invoke(prompt)\n    state[\"count\"] += 1\n    state[\"article\"] = result.content\n    print(\"generate  \" + \"*\" * 80)\n    print(state[\"article\"])\n    return state", "level": 6, "children": []}, {"id": "n_22d0c072bb", "title": "def evaluate(state):\n    prompt = \"\"\"判断【论证文章】是否很好地论证了【主题】，是否逻辑严密，有说服力。如果合格，指出文章的优点；如果不合格，给出具体的修改意见。\n    \n    【主题】\n    \"\"\"+state[\"topic\"]+\"\"\"\n    \n    【论证文章】\n    \"\"\"+state[\"article\"]\n\n    evaluator = llm.with_structured_output(Feedback)\n    result = evaluator.invoke(prompt)\n    state[\"qualified\"] = result.grade\n    state[\"feedback\"] = result.feedback\n    print(\"evaluate  \" + \"*\" * 80)\n    print(state[\"qualified\"])\n    print(state[\"feedback\"])\n    return state", "level": 6, "children": []}]}, {"id": "n_314600bfa9", "title": "智能体", "level": 5, "children": [{"id": "n_4a2729c2bd", "title": "自主使用工具，整合结果", "level": 6, "children": []}, {"id": "n_534357151e", "title": "def getTrainSchedule(queryDate,start,end):\n    \"\"\"根据指定的日期、起点城市名称和终点城市名称，查询列车班次\"\"\"\n    print(\"获取列车时刻表\")\n    result = [[\"D81\",\"12:24\",\"14:30\",\"北京西站\",\"540\"],[\"K4427\",\"15:38\",\"21:30\",\"北京站\",\"220\"]]\n    resultStr = \"您查询的在 \"+queryDate+\" 这一天从 \"+start+\" 到 \"+end+\" 的列车共有 \"+str(len(result))+\"班：\\n\"\n    for res in result:\n        resultStr+=res[0]+\" 次列车：发车时间为: \"+res[1]+\" 到站时间为： \"+res[2]+\" 发车站为： \"+res[3]+\" 票价为： \"+res[4]+\"\\n\"\n    return resultStr", "level": 6, "children": []}, {"id": "n_6f6118b2b6", "title": "def getAvailableHotel(queryDate,location):\n    \"\"\"根据指定的日期和城市名称，查询可用的旅店\"\"\"\n    print(\"获取目的地旅馆的情况\")\n    result = [[\"丽晶酒店\", \"五星级\", \"大床房\", \"1200\"], [\"丽晶大宾馆\", \"二星级\", \"标准间\", \"300\"]]\n    resultStr = \"您查询的 \" + queryDate + \" 这一天可以预定的酒店有\" + str(len(result)) + \"家：\\n\"\n    for res in result:\n        resultStr += res[0] + \" 等级为 \" + res[1] + \" 房间是 27a0493", "title": "类型", "level": 3, "children": [{"id": "n_77a118b60d", "title": "Prompt Tuning", "level": 4, "children": []}, {"id": "n_062832b61f", "title": "P-Tuning", "level": 4, "children": []}, {"id": "n_5c8bc97039", "title": "PPT", "level": 4, "children": []}]}]}]}, {"id": "n_5672d28454", "title": "Prompt Tuning", "level": 1, "children": [{"id": "n_eb423603db", "title": "特点", "level": 2, "children": [{"id": "n_27ad2a4a2d", "title": "为每一个输入文本假设一个固定前缀提示，该提示表由神经网络参数化，并在下游任务微调时进行更新，整个过程中预训练的大模型参数被冻结", "level": 3, "children": []}]}, {"id": "n_69084ca555", "title": "优点", "level": 2, "children": [{"id": "n_511190fa44", "title": "大模型的微调新范式", "level": 3, "children": []}, {"id": "n_070c151c44", "title": "模型参数规模大了之后，可以将大模型参数固定，指定附加参数来适配下游任务，而且适配性能基本和全参数微调相当。", "level": 3, "children": []}]}, {"id": "n_0f4e3a0e05", "title": "缺点", "level": 2, "children": [{"id": "n_479e201547", "title": "在小样本学习场景上表现不太行", "level": 3, "children": []}, {"id": "n_d1574d59ab", "title": "收敛速度比较慢", "level": 3, "children": []}, {"id": "n_195594aaaa", "title": "调参比较复杂", "level": 3, "children": []}]}]}, {"id": "n_bc7f93b776", "title": "P-Tuning", "level": 1, "children": [{"id": "n_af34098bc9", "title": "特点", "level": 2, "children": [{"id": "n_bd0cd5d087", "title": "引入Prompt Encoder来编码伪标记的相互依赖关系", "level": 3, "children": []}, {"id": "n_28c248b78c", "title": "选定部分具有与当前句子语义代表性的一些词作为一些伪标记的初始化", "level": 3, "children": []}, {"id": "n_bfab5a8204", "title": "Prompt Encoder只在训练时候会使用到，而在推理阶段则不再使用。", "level": 3, "children": []}, {"id": "n_8551dcc0ac", "title": "将连续提示与离散token进行混合", "level": 3, "children": []}]}, {"id": "n_96631c227c", "title": "P-tuning的特点", "level": 2, "children": [{"id": "n_471a3ff8fb", "title": "优点", "level": 3, "children": [{"id": "n_fb18ac3632", "title": "引入了一个 LSTM +MLP模块对 soft prompt 进行建模，能捕捉 token 之间的顺序和语义关系", "level": 4, "children": []}, {"id": "n_313d5e5b3d", "title": "改进了离散 prompt的不稳定性问题，收敛速度更快", "level": 4, "children": []}]}, {"id": "n_a1d72035a6", "title": "缺点", "level": 3, "children": [{"id": "n_776695a7b0", "title": "仅放在输入层时，对模型内部深层表征的影响有限，面对一些需要深层表示调整的 NLU/序列标注任务表现并不稳定或不足", "level": 4, "children": []}, {"id": "n_c013b73a69", "title": "在中小模型（100M–1B）表现较差", "level": 4, "children": []}]}]}, {"id": "n_8eca3e541f", "title": "升级", "level": 2, "children": [{"id": "n_d58a0b9777", "title": "P-Tuning V2在模型的每一层都应用连续的 prompts 并对 prompts 参数进行更新优化。", "level": 3, "children": []}]}, {"id": "n_3474b13cf2", "title": "P-tuning V2的特点", "level": 2, "children": [{"id": "n_9c001631ba", "title": "优点", "level": 3, "children": [{"id": "n_25639727ac", "title": "把 soft prompts 注入每层，能在多种规模与任务上接近全量微调效果", "level": 4, "children": []}]}, {"id": "n_ef7f572751", "title": "缺点", "level": 3, "children": [{"id": "n_deba05badd", "title": "深层 prompt 或长 soft prompt 会占用较多 token / 输入空间", "level": 4, "children": []}, {"id": "n_3f33d5bd59", "title": "P-tuning 的 soft prompt 是针对每个下游任务独立训练的，无法直接迁移到其他任务上使用", "level": 4, "children": []}]}]}]}, {"id": "n_540d64e2d9", "title": "Pre-trained Prompt Tuning(PPT)", "level": 1, "children": [{"id": "n_7d483319ac", "title": "特点", "level": 2, "children": [{"id": "n_4fefa6e7e3", "title": "PPT旨在通过先让这些连续提示在大量无标注的预训练语料进行预训练，然后将其加载到对应下游任务的PLM上进行训练", "level": 3, "children": []}]}, {"id": "n_888114830a", "title": "优点", "level": 2, "children": [{"id": "n_9cd0d3174c", "title": "预训练soft-prompt带来了 小样本学习场景上的显著提升", "level": 3, "children": []}, {"id": "n_c0794833f1", "title": "缓解了prompt-tuning收敛慢的问题", "level": 3, "children": []}, {"id": "n_9528ddab28", "title": "PPT 是在多个任务上预训练出具有“任务泛化能力”的 soft prompt，可以直接复用到新任务上，尤其适合多任务场景。", "level": 3, "children": []}]}, {"id": "n_e49ef23631", "title": "缺点", "level": 2, "children": [{"id": "n_98387b07b1", "title": "高度依赖于源任务集的覆盖度与多样性(一旦目标任务与预训练时用到的源任务在分布、格式或语义上差异较大，通用提示 𝑃就难以提供有效的初始引导，导致下游微调效果大幅下降)", "level": 3, "children": []}]}]}]}]}]}, {"stage_id": "stage_12", "stage_name": "阶段12 大模型核心专题", "stage_order": 12, "xmind_files": [{"file_key": "大模型蒸馏课程.xmind", "latest": {"date": "2025-05-16", "path": "阶段12 大模型核心专题\\5月16日-大模型核心专题\\大模型 查询：前端先调用非流式查询接口，得到答案或者is_streaming的状态值。", "level": 4, "children": [{"id": "n_a469bba00b", "title": "非流式查询：前端先调用非流式查询接口，得到答案或者is_streaming的状态值。", "level": 5, "children": [{"id": "n_c33527cddd", "title": "如果is_streaming = True，调用流式接口", "level": 6, "children": []}, {"id": "n_af02650ede", "title": "如果is_stream = False，直接返回答案", "level": 6, "children": []}]}]}, {"id": "n_56ea4dd36e", "title": "流式查询", "level": 4, "children": [{"id": "n_38ea68f824", "title": "前端请求流式查询接口：query, source_filter, session_id", "level": 5, "children": []}, {"id": "n_c16ae76bde", "title": "开启socket通道，判断query是否是常见问候，如果是，返回对应的模板回复。", "level": 5, "children": []}, {"id": "n_8e2b3ef6d4", "title": "如果不是常见问候，查询rag系统，逐个token发送给socket通道", "level": 5, "children": []}, {"id": "n_b25990b72d", "title": "传输完毕后，返回type = end的标志", "level": 5, "children": []}, {"id": "n_864faec66b", "title": "如果传输的过程中遇到问题， 返回type = error 以及具体的报错信息", "level": 5, "children": []}]}]}]}]}]}]}, {"id": "n_6aea0e35b0", "title": "EduRAG智慧问答系统迭代过程", "level": 0, "source_file": "EduRAG智慧问答系统迭代过程.xmind", "source_path": "阶段13 知识图谱项目\\5月30日-RAG+Agent串讲\\EduRAG智慧问答系统迭代过程.xmind", "source_date": "2025-05-30", "stage_id": "stage_13", "children": [{"id": "n_c0864f5628", "title": "EduRAG智慧问答系统", "level": 0, "children": [{"id": "n_40a15ad763", "title": "项目背景", "level": 1, "children": [{"id": "n_0a578f92a6", "title": "**通用知识支持**：提供精准、广泛认可的 IT 基础知识（如编程概念、算法原理），无需检索即可快速回答。", "level": 2, "children": []}, {"id": "n_d2cf134b8e", "title": "**私有化知识支持**：准确回答机构特有信息（如培训费用、课程大纲），确保答案基于内部知识库，避免 LLM 推测。", "level": 2, "children": []}, {"id": "n_20bd703f05", "title": "**高效性与精准性**：快速响应简单查询，深度检索复杂问题，确保私有化知识的权威性。", "level": 2, "children": []}, {"id": "n_1271975cf3", "title": "**用户体验**：对于无法回答的问题，提供清晰的指引（如联系人工客服，电话 12345678）。", "level": 2, "children": []}, {"id": "n_c27f6a2750", "title": "**场景适配**：支持 IT 教培行业的多学科分类（如 AI、Java、测试等），并优化检索效率。", "level": 2, "children": []}]}, {"id": "n_b31dda3749", "title": "RAG-V1：基础 RAG 系统", "level": 1, "children": [{"id": "n_a09354cec3", "title": "设计目标", "level": 2, "children": [{"id": "n_4d09177b9a", "title": "构建一个基础的 **Retrieval-Augmented Generation (RAG)** 系统，结合向量检索和大语言模型（LLM），实现 IT 教育知识的初步查询。", "level": 3, "children": []}]}, {"id": "n_5afc3bd9f5", "title": "核心功能", "level": 2, "children": [{"id": "n_61825f1677", "title": "**文档加载与切分**：支持从文件夹加载多种类型文档（如 .txt、.pdf），分层切分为父块和子块。", "level": 3, "children": []}, {"id": "n_4a952bac50", "title": "**向量存储**：使用 Milvus 存储文档的稠密向量嵌入。", "level": 3, "children": []}, {"id": "n_6fae5dcb56", "title": "**答案生成**：基于检索上下文生成回答。", "level": 3, "children": []}]}, {"id": "n_0422ff171f", "title": "技术实现", "level": 2, "children": [{"id": "n_265eeb33de", "title": "1.1 系统配置文件", "level": 3, "children": [{"id": "n_37720638f8", "title": "config.py``` python\nimport logging  # 导入日志模块\nimport os  # 导入操作系统模块\nimport torch\nfrom transformers import AutoModelForSequenceClassification, AutoTokenizer\n\n\ndef setup_logging(log_file=\"logs/rag_log.txt\"):\n    \"\"\"配置日志记录，保存到本地文件并输出到控制台\"\"\"\n    # 确保日志目录存在\n    os.makedirs(os.path.dirname(log_file), exist_ok=True)\n    # 创建日志器，命名为 RAG_System\n    logger = logging.getLogger(\"RAG_System\")\n    # 设置日志级别为 INFO\n    logger.setLevel(logging.INFO)\n\n    # 检查是否已添加处理器，避免重复\n    if not logger.handlers:\n        # 创建文件处理器，写入指定日志文件\n        file_handler = logging.FileHandler(log_file, encoding='utf-8')\n        # 设置文件日志级别为 INFO\n        file_handler.setLevel(logging.INFO)\n        # 创建控制台处理器，输出到终端\n        console_handler = logging.StreamHandler()\n        # 设置控制台日志级别为 INFO\n        console_handler.setLevel(logging.INFO)\n\n        # 定义日志格式：时间-名称-级别-消息\n        formatter = logging.Formatter('%(asctime)s - %(name)s - %(levelname)s - %(message)s')\n        # 为文件处理器设置格式\n        file_handler.setFormatter(formatter)\n        # 为控制台处理器设置格式\n        console_handler.setFormatter(formatter)\n\n        # 添加文件处理器到日志器\n        logger.addHandler(file_handler)\n        # 添加控制台处理器到日志器\n        logger.addHandler(console_handler)\n\n    # 返回配置好的日志器\n    return logger\n\n\nclass Config:\n    \"\"\"全局配置类，管理系统参数\"\"\"\n    # Milvus 主机地址，默认本地\n    HOST = \"localhost\"\n    # Milvus 端口，默认 19530\n    PORT = \"19530\"\n    # 数据库名称，默认 itcast\n    DATABASE_NAME = \"itcast\"\n    # 集合名称，默认 subject_kb\n    COLLECTION_NAME = \"subject_kb_v4\"\n    # 连接别名，默认 default\n    ALIAS = \"default\"\n    # 嵌入模型，默认 mxbai-embed-large\n    EMBEDDING_MODEL = \"mxbai-embed-large\"\n    # LLM 模型，默认 qwen2.5:7b\n    LLM_MODEL = \"qwen2.5:7b\"\n    # 分块大小，默认 300 字符\n    CHUNK_SIZE = 300\n    # 父块分块大小，默认 1200 字符\n    PARENT_CHUNK_SIZE = 1200\n    # 子块分块大小，默认 300 字符\n    CHILD_CHUNK_SIZE = 300\n    # 子块重叠大小，默认 50 字符\n    CHUNK_OVERLAP = 50\n    # 检索返回的文档数量，默认 5\n    RETRIEVAL_K = 5\n    # 默认候选数量，用于混合检索\n    CANDIDATE_M = 5\n    # 合并父块的子块阈值，默认 2\n    MERGE_THRESHOLD_N = 2\n    TOKENIZER = AutoTokenizer.from_pretrained('/Users/ligang/PycharmProjects/LLM/Models/bge/bge-reranker-large')\n    MODEL = AutoModelForSequenceClassification.from_pretrained('/Users/ligang/PycharmProjects/LLM/Models/bge/bge-reranker-large')\n    # 支持的学科类别列表\n    VALID_SOURCES = [\"ai\", \"java\", \"test\", \"ops\", \"bigdata\"]\n```", "level": 4, "children": []}]}, {"id": "n_26928863e8", "title": "1.2 文档解析切分", "level": 3, "children": [{"id": "n_8bcceb3ffd", "title": "包含：pdf、ppt、docx、png、txt等多种文档加载的自定义方法", "level": 4, "children": []}, {"id": "n_4bd9b78849", "title": "包含：ChineseRecursiveTextSplitter自定义的文档切分方法", "level": 4, "children": []}, {"id": "n_f573f5ff5e", "title": "document_loader.py``` python\nimport os       # 导入操作系统模块\nfrom src.base.config import Config, setup_logging  # 导入配置和日志模块\nfrom langchain_community.document_loaders import TextLoader  # 导入文本加载器\nfrom edu_document_loaders import OCRPDFLoader, OCRDOCLoader, OCRPPTLoader, OCRIMGLoader  # 导入自定义 OCR 加载器\nfrom edu_text_spliter import ChineseRecursiveTextSplitter    # 导入中文分块器\n# 定义支持的文件类型及其对应的加载器\ndocument_loaders = {\n    \".txt\": TextLoader,      # 文本文件加载器\n    \".pdf\": OCRPDFLoader,    # PDF 文件 OCR 加载器\n    \".docx\": OCRDOCLoader,   # DOCX 文件 OCR 加载器\n    \".ppt\": OCRPPTLoader,    # PPT 文件 OCR 加载器\n    \".pptx\": OCRPPTLoader,   # PPTX 文件 OCR 加载器\n    \".jpg\": OCRIMGLoader,    # JPG 图片 OCR 加载器\n    \".png\": OCRIMGLoader     # PNG 图片 OCR 加载器\n}\n\ndef load_documents_from_directory(directory_path, logger):\n    \"\"\"从指定文件夹加载多种类型文件，并添加元数据\"\"\"\n    documents = []  # 初始化文档列表，用于存储加载的文档\n    supported_extensions = document_loaders.keys()  # 获取支持的文件扩展名集合\n    print(f'os.path.basename(directory_path)--->{os.path.basename(directory_path)}')\n    source = os.path.basename(directory_path).replace(\"_data\", \"\")  # 从目录名提取 source，如 \"ai_data\" -> \"ai\"\n\n    for root, _, files in os.walk(directory_path):  # 遍历目录及其子目录\n        for file in files:  # 遍历每个文件\n            file_path = os.path.join(root, file)  # 构造文件完整路径\n            file_extension = os.path.splitext(file_path)[1].lower()  # 获取文件扩展名并转换为小写\n            if file_extension in supported_extensions:  # 检查文件类型是否支持\n                try:\n                    loader_class = document_loaders[file_extension]  # 获取对应文件类型的加载器类\n                    loader = loader_class(file_path)  # 实例化加载器\n                    loaded_docs = loader.load()  # 加载文档内容\n                    for doc in loaded_docs:  # 遍历加载的每个文档\n                        doc.metadata[\"source\"] = source  # 添加学科类别元数据\n                        doc.metadata[\"timestamp\"] = datetime.now().isoformat()  # 添加当前时间戳元数据\n                    documents.extend(loaded_docs)  # 将加载的文档添加到列表\n                    logger.info(f\"成功加载文件: {file_path}\")  # 记录成功加载日志\n                except Exception as e:\n                    logger.error(f\"加载文件 {file_path} 失败: {str(e)}\")  # 记录加载失败日志\n            else:\n                logger.warning(f\"不支持的文件类型: {file_path}\")  # 记录不支持的文件类型警告\n    return documents  # 返回加载的文档列表\n\n\ndef process_documents_single(directory_path, logger, chunk_size=300, chunk_overlap=50):\n    \"\"\"处理文档：加载、分块并返回分块结果\"\"\"\n    # 从目录加载所有文档\n    documents = load_documents_from_directory(directory_path, logger)\n    # 记录加载的文档数量\n    logger.info(f\"加载的文档数量: {len(documents)}\")\n    # 初始化中文分块器，设置分块大小和重叠\n    text_splitter = ChineseRecursiveTextSplitter(chunk_size=chunk_size, chunk_overlap=chunk_overlap)\n    # 对文档进行分块\n    chunks = text_splitter.split_documents(documents)\n    # 记录分块后的文档数量\n    logger.info(f\"分块后的文档数量: {len(chunks)}\")\n    # 返回分块结果\n    return chunks\n\n\ndef process_documents_muti(directory_path, logger, parent_chunk_size=1200, child_chunk_size=300, chunk_overlap=50):\n    \"\"\"处理文档：加载、分层切分为父块和子块并返回子块结果\"\"\"\n    # 从目录加载所有文档\n    documents = load_documents_from_directory(directory_path, logger)\n    # 记录加载的文档数量\n    logger.info(f\"加载的文档数量: {len(documents)}\")\n\n    # 初始化父块分块器，设置父块大小和重叠\n    parent_splitter = ChineseRecursiveTextSplitter(chunk_size=parent_chunk_size, chunk_overlap=chunk_overlap)\n    # 初始化子块分块器，设置子块大小和重叠\n    child_splitter = ChineseRecursiveTextSplitter(chunk_size=child_chunk_size, chunk_overlap=chunk_overlap)\n\n    # 分层切分文档\n    parent_chunks = []\n    child_chunks = []\n    for i, doc in enumerate(documents):\n        # 先切分为父块\n        parent_docs = parent_splitter.split_documents([doc])\n        for j, parent_doc in enumerate(parent_docs):\n            # 为每个父块生成唯一 ID\n            parent_id = f\"doc_{i}_parent_{j}\"\n            # 将父块内容存储到元数据\n            # parent_doc.metadata[\"parent_id\"] = parent_id\n            # parent_doc.metadata[\"parent_content\"] = parent_doc.page_content\n            # parent_chunks.append(parent_doc)\n            # 再将父块切分为子块\n            sub_chunks = child_splitter.split_documents([parent_doc])\n            for sub_chunk in sub_chunks:\n                # 为子块添加父块信息\n                sub_chunk.metadata[\"parent_id\"] = parent_id\n                sub_chunk.metadata[\"parent_content\"] = parent_doc.page_content\n                child_chunks.append(sub_chunk)\n\n    # 记录父块和子块数量\n    logger.info(f\"父块数量: {len(parent_chunks)}\")\n    logger.info(f\"子块数量: {len(child_chunks)}\")\n    # 返回子块结果\n    return child_chunks\n\nif __name__ == '__main__':\n    logger = setup_logging()\n    chunks = process_documents_muti(\n        directory_path='../../../data',\n        logger=logger,\n        parent_chunk_size=Config.PARENT_CHUNK_SIZE,  # 父块切分大小\n        child_chunk_size=Config.CHILD_CHUNK_SIZE,  # 子块切分大小\n        chunk_overlap=Config.CHUNK_OVERLAP  # 重叠大小\n    )\n    print(chunks[0])\n```", "level": 4, "children": []}]}, {"id": "n_47cc1f1d3d", "title": "1.3 prompt提示模版", "level": 3, "children": [{"id": "n_758ec755ad", "title": "prompts.py``` python\nfrom langchain.prompts import PromptTemplate\n\nclass RAGPrompts:\n    \"\"\"V1 Prompt 模板类，提供多种严格依赖上下文的模板\"\"\"\n\n    @staticmethod\n    def strict_context_prompt():\n        \"\"\"严格模式：仅使用上下文，不允许编造\"\"\"\n        return PromptTemplate(\n            template=\"\"\"\n            根据以下上下文回答问题，仅使用提供的上下文信息，不得编造或推测。  \n            如果上下文不足以回答问题，请说“信息不足，无法回答”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n\n    @staticmethod\n    def detailed_context_prompt():\n        \"\"\"详细模式：提供详细回答，限制于上下文\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文提供详细回答，仅使用上下文信息，不得添加未提及的内容。  \n            如果上下文不足，请说“信息不足，无法提供详细回答”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n\n    @staticmethod\n    def concise_context_prompt():\n        \"\"\"简洁模式：简短回答，依赖上下文\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文简洁回答问题，仅使用上下文信息。  \n            如果上下文不足，请说“上下文不足”。  \n            上下文: {context}  \n            问题: {question}  \n            回答p:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n```", "level": 4, "children": []}]}, {"id": "n_9a120641c7", "title": "1.4 vector_store向量数据库构建", "level": 3, "children": []}, {"id": "n_ebeeac1738", "title": "1.5 rag_syetem检索系统设计", "level": 3, "children": []}, {"id": "n_2be6387f16", "title": "1.6 main_v1主逻辑代码", "level": 3, "children": []}]}]}, {"id": "n_20e5698909", "title": "RAG-V2：实现查询增强", "level": 1, "children": [{"id": "n_6296c43739", "title": "设计目标", "level": 2, "children": [{"id": "n_44e8d9efd1", "title": "实现查询增强", "level": 3, "children": []}]}, {"id": "n_e38265fc63", "title": "核心功能扩展（基于 V1）", "level": 2, "children": [{"id": "n_9aa9a0d0b2", "title": "**假设问题**:", "level": 3, "children": [{"id": "n_7b0e6e6d86", "title": "创建假设问题涉及利用 LLM 生成用户可能会就每个文档块中的内容提出的多个问题。在用户的实际查询到达 LLM 之前，向量存储会检索与实际查询最相关的假设问题及其相应的文档块，并将其转发给 LLM。", "level": 4, "children": []}]}, {"id": "n_dbdedb7540", "title": "**假设文档嵌入：**", "level": 3, "children": [{"id": "n_5e77dbd4a2", "title": "HyDE 是假设文档嵌入的缩写。它利用 LLM 制作一个\"假设文档\"或假答案，以回应没有上下文信息的用户查询。然后，这个假答案会被转换成向量嵌入，并用于查询向量数据库中最相关的文档块。随后，向量数据库会检索出 Top-K 最相关的文档块，并将它们传送给 LLM 和原始用户查询，从而生成最终答案。", "level": 4, "children": []}]}, {"id": "n_e50c235cef", "title": "**子查询**：", "level": 3, "children": [{"id": "n_9d7c459cde", "title": "当用户查询过于复杂时，我们可以使用 LLM 将其分解为更简单的子查询，然后再将其传递给向量数据库和 LLM。", "level": 4, "children": []}, {"id": "n_09582d3fc3", "title": "让我们来看一个例子。设想有用户问：\"Milvus 和 Zilliz Cloud 在功能上有什么不同？\" 这个问题相当复杂，在我们的知识库中可能没有直接的答案。为了解决这个问题，我们可以将其拆分成两个更简单的子查询：子查询 1：\"Milvus 有哪些功能？\"子查询 2：\"Zilliz Cloud 有哪些功能？\"", "level": 4, "children": []}]}, {"id": "n_ac410e999b", "title": "**回溯提示：**", "level": 3, "children": [{"id": "n_20b8501abe", "title": "简化复杂用户查询的另一种方法是创建回溯提示。这种技术包括使用 LLM 将复杂的用户查询抽象为\"回溯问题\"**。然后，向量数据库利用这些回溯问题来检索最相关的文档块。最后，LLM 根据这些检索到的文档块生成更准确的答案。", "level": 4, "children": []}, {"id": "n_d4cfa891df", "title": "让我们用一个例子来说明这种技术。请看下面这个查询，它相当复杂，无法直接回答：原始用户查询：\"我有一个包含 100 亿条记录的数据集，想把它存储到 Milvus 中进行查询。可以吗？为了简化这个用户查询，我们可以使用 LLM 生成一个更直接的回溯问题：回退问题：\"Milvus 可以处理的数据集大小限制是多少？\"", "level": 4, "children": []}]}]}, {"id": "n_7c62b53389", "title": "技术实现", "level": 2, "children": [{"id": "n_44de35ac26", "title": "2.1 系统配置文件（和V1一致）", "level": 3, "children": []}, {"id": "n_667ae38f8b", "title": "2.2 文档解析切分（和V1一致）", "level": 3, "children": []}, {"id": "n_b12218f2dc", "title": "2.3 prompt提示模版", "level": 3, "children": [{"id": "n_f3181d4ad1", "title": "prompts.py``` python\nfrom langchain.prompts import PromptTemplate\n\nclass RAGPrompts:\n    \"\"\"V2 Prompt 模板类，提供查询增强相关模板\"\"\"\n\n    @staticmethod\n    def strict_context_prompt():\n        \"\"\"严格模式：强制逐字引用上下文，确保精确匹配\"\"\"\n        return PromptTemplate(\n            template=\"\"\"\n            根据以下上下文回答问题，必须逐字引用上下文中的相关内容，不得改动或推测。  \n            如果上下文无法直接提供答案，请说“上下文无直接答案”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n\n    @staticmethod\n    def detailed_context_prompt():\n        \"\"\"详细模式：要求全面总结上下文，覆盖所有相关细节\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文提供详细回答，全面总结上下文中的所有相关信息，不得遗漏细节或添加未提及内容。  \n            如果上下文不足以回答问题，请说“上下文信息不足以提供完整回答”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n\n    @staticmethod\n    def concise_context_prompt():\n        \"\"\"简洁模式：提取上下文核心信息，简短回答\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文提取核心信息，简洁回答问题，仅使用上下文内容，不得扩展或编造。  \n            如果上下文无明确答案，请说“上下文无明确答案”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]\n        )\n\n    @staticmethod\n    def hypothetical_questions_prompt():\n        \"\"\"生成假设问题的 Prompt\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下文档块生成 3 个用户可能会提出的问题：  \n            文档块: {chunk}  \n            生成的问题:  \n            \"\"\",\n            input_variables=[\"chunk\"]\n        )\n\n    @staticmethod\n    def hyde_prompt():\n        \"\"\"HyDE：生成假设答案的 Prompt\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下查询生成一个简短的假设答案，不需要上下文：  \n            查询: {query}  \n            假设答案:  \n            \"\"\",\n            input_variables=[\"query\"]\n        )\n\n    @staticmethod\n    def subquery_prompt():\n        \"\"\"子查询分解 Prompt\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            将以下复杂查询分解为 2-3 个简单的子查询：  \n            查询: {query}  \n            子查询:  \n            \"\"\",\n            input_variables=[\"query\"]\n        )\n\n    @staticmethod\n    def backtracking_prompt():\n        \"\"\"回溯提示 Prompt\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            将以下复杂查询抽象为一个更简单的问题：  \n            查询: {query}  \n            简化问题:  \n            \"\"\",\n            input_variables=[\"query\"]\n        )\n```", "level": 4, "children": []}]}, {"id": "n_ff84069688", "title": "2.4 vector_store向量数据库构建（和V1一致）", "level": 3, "children": []}, {"id": "n_c70695bc01", "title": "2.5 rag_syetem检索系统设计", "level": 3, "children": []}, {"id": "n_34f77a3aac", "title": "2.6 main_v2主逻辑代码", "level": 3, "children": []}]}]}, {"id": "n_642cec2727", "title": "RAG-V3：增强索引", "level": 1, "children": [{"id": "n_5703239223", "title": "设计目标", "level": 2, "children": [{"id": "n_f84972bd37", "title": "增强索引", "level": 3, "children": []}]}, {"id": "n_4fc7f90377", "title": "核心功能（实现索引增强）", "level": 2, "children": [{"id": "n_0c1747e31e", "title": "**多粒度切块：**", "level": 3, "children": [{"id": "n_8a9fe1e0fb", "title": "在建立索引时，我们可以采用两种粒度：子块及其对应的父块。起初，我们以更细的粒度搜索子块。然后，我们采用一种合并策略：如果前k 个子块中有特定数量（n）的子块属于同一个父块，我们就把这个父块作为上下文信息提供给 LLM。", "level": 4, "children": []}]}, {"id": "n_84e0629121", "title": "**混合检索**：", "level": 3, "children": [{"id": "n_534b1ffb12", "title": "混合检索和重排技术将一种或多种辅助检索方法与向量相似性检索相结合。然后，Reranker会根据检索结果与用户查询的相关性对检索结果重新排序。常见的补充检索算法包括基于词频的方法（如BM25）或利用稀疏嵌入的大模型（如SPLADE）。重新排序算法包括 RRF 或更复杂的模型，如Cross-Encoder（类似于 BERT 的架构）。", "level": 4, "children": []}]}]}, {"id": "n_84a1c0610d", "title": "技术实现", "level": 2, "children": [{"id": "n_d5bffe8b62", "title": "3.1 系统配置文件（和V2一致）", "level": 3, "children": []}, {"id": "n_a7b2fcd7f6", "title": "3.2 文档解析切分（和V2一致）", "level": 3, "children": []}, {"id": "n_a6e94f8301", "title": "3.3 prompt提示模版", "level": 3, "children": [{"id": "n_5e4bba60a1", "title": "prompts.py``` python\nfrom langchain.prompts import PromptTemplate  # 导入 Prompt 模板类\n\nclass RAGPrompts:\n    \"\"\"V3 Prompt 模板类，提供多种查询提示模板\"\"\"\n\n    @staticmethod\n    def strict_context_prompt():\n        \"\"\"严格模式：仅使用上下文，不允许编造\"\"\"\n        return PromptTemplate(\n            template=\"\"\"\n            根据以下上下文回答问题，仅使用提供的上下文信息，不得编造或推测。  \n            如果上下文不足以回答问题，请说“信息不足，无法回答”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]  # 定义输入变量\n        )\n\n    @staticmethod\n    def detailed_context_prompt():\n        \"\"\"详细模式：提供详细回答，限制于上下文\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文提供详细回答，仅使用上下文信息，不得添加未提及的内容。  \n            如果上下文不足，请说“信息不足，无法提供详细回答”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]  # 定义输入变量\n        )\n\n    @staticmethod\n    def concise_context_prompt():\n        \"\"\"简洁模式：简短回答，依赖上下文\"\"\"\n        return PromptTemplate(\n            template=\"\"\"  \n            根据以下上下文简洁回答问题，仅使用上下文信息。  \n            如果上下文不足，请说“上下文不足”。  \n            上下文: {context}  \n            问题: {question}  \n            回答:  \n            \"\"\",\n            input_variables=[\"context\", \"question\"]  # 定义输入变量\n        )\n```", "level": 4, "children": []}]}, {"id": "n_8af472c58a", "title": "3.4 vector_store向量数据库构建", "level": 3, "children": []}, {"id": "n_8533615ad7", "title": "3.5 rag_syetem检索系统设计", "level": 3, "children": []}, {"id": "n_de6491ab54", "title": "3.6 main_v3主逻辑代码", "level": 3, "children": []}]}]}, {"id": "n_afe98f9ae2", "title": "RAG-V4：改进检索器", "level": 1, "children": [{"id": "n_6544da0417", "title": "设计目标", "level": 2, "children": [{"id": "n_5e60ce2808", "title": "在 RAG-V3 的基础上，增加元数据过滤策略，确保检索结果更精准。", "level": 3, "children": []}, {"id": "n_8a85a9228b", "title": "支持基于学科类别（如 AI、Java 等）的过滤，提升 IT 教育知识咨询的针对性。", "level": 3, "children": []}]}, {"id": "n_260e482f69", "title": "核心功能（基于 V3）", "level": 2, "children": [{"id": "n_04776f310c", "title": "**元数据过滤：**", "level": 3, "children": [{"id": "n_35bbfc7c4d", "title": "为了确保更精确的答案，我们可以在将文档传递给 LLM 之前，通过过滤时间和类别等元数据来完善检索到的文档。例如，如果检索到的财务报告跨越多个年份，那么根据所需的年份进行过滤就能完善信息，满足特定要求。事实证明，这种方法在需要大量数据和详细元数据的情况下非常有效，例如图书馆 Collections 中的内容检索。", "level": 4, "children": []}]}, {"id": "n_4aa777e863", "title": "查询场景", "level": 3, "children": [{"id": "n_dda2d979e9", "title": "用户首先选择咨询的学科（如 “我想咨询 AI 相关问题”）。", "level": 4, "children": []}, {"id": "n_8c0330cc22", "title": "检索时，根据用户选择的学科过滤文档，只返回对应类别的结果。", "level": 4, "children": []}]}]}, {"id": "n_4feda0f283", "title": "技术实现", "level": 2, "children": [{"id": "n_fe51263172", "title": "4.1 系统配置文件（和V3一致）", "level": 3, "children": []}, {"id": "n_b3bdc7818d", "title": "4.2 文档解析切分（和V3一致）", "level": 3, "children": []}, {"id": "n_12de12deaf", "title": "4.3 prompt提示模版（和V3一致）", "level": 3, "children": []}, {"id": "n_bf8eb7f51e", "title": "4.4 vector_store向量数据库构建", "level": 3, "children": []}, {"id": "n_5791923e77", "title": "4.5 rag_syetem检索系统设计", "level": 3, "children": []}, {"id": "n_ec02b6022b", "title": "4.6 main_v4主逻辑代码", "level": 3, "children": []}]}]}, {"id": "n_6c496213d0", "title": "RAG-V5：引入 Self-RAG 自我反思", "level": 1, "children": [{"id": "n_c7b4ab040b", "title": "设计目标", "level": 2, "children": [{"id": "n_17718c0695", "title": "引入 Self-RAG 自我反思机制，提升复杂查询和私有化知识的答案质量。", "level": 3, "children": []}, {"id": "n_c7358a6590", "title": "确保私有化知识的精准性。", "level": 3, "children": []}]}, {"id": "n_de5e1a3a84", "title": "核心功能（基于 V4）", "level" 或13*13网格+网格对目标负责", "level": 4, "children": []}]}, {"id": "n_4fbb532112", "title": "YOLOv1", "level": 3, "children": [{"id": "n_40fa4d1654", "title": "主要特点", "level": 4, "children": [{"id": "n_40def55fb8", "title": "优点", "level": 5, "children": [{"id": "n_4533ed2133", "title": "速度非常快，处理速度可以达到45fps，其快速版本（网络较小）甚至可以达到155fps。", "level": 6, "children": []}, {"id": "n_3ee79189eb", "title": "训练和预测可以端到端的进行，非常简便。", "level": 6, "children": []}]}, {"id": "n_50a41007c1", "title": "缺点", "level": 5, "children": [{"id": "n_f7a0bc789a", "title": "准确率会打折扣", "level": 6, "children": []}, {"id": "n_9797b6ed02", "title": "对于小目标和靠的很近的目标检测效果并不好", "level": 6, "children": []}]}]}, {"id": "n_da1966fe39", "title": "网络结构", "level": 4, "children": [{"id": "n_0257b5374a", "title": "(未命名)", "level": 5, "children": []}, {"id": "n_6dec248cfd", "title": "输入大小", "level": 5, "children": [{"id": "n_2048773635", "title": "224*224", "level": 6, "children": []}]}, {"id": "n_2afbb62b65", "title": "最后特征图", "level": 5, "children": [{"id": "n_45d770bbec", "title": "VOC", "level": 6, "children": [{"id": "n_a908024032", "title": "7*7*30", "level": 7, "children": [{"id": "n_efc118b82a", "title": "20+xywhc+xywhc", "level": 8, "children": []}]}]}, {"id": "n_2cf7a876e3", "title": "COCO", "level": 6, "children": [{"id": "n_532a970da9", "title": "7*7*90", "level": 7, "children": [{"id": "n_ddeec1a9ea", "title": "80+xywhc+xywhc", "level": 8, "children": []}]}]}]}]}, {"id": "n_6ddfa6556b", "title": "模型训练", "level": 4, "children": [{"id": "n_8890d0e9f4", "title": "225", "level": 5, "children": []}]}, {"id": "n_5ba885d58b", "title": "模型预测", "level": 4, "children": [{"id": "n_a962b70f87", "title": "1.Resize到416*416", "level": 5, "children": []}, {"id": "n_bbaa10eae3", "title": "2.送入GoogLeNet进行特征提取，得到7*7*30", "level": 5, "children": []}, {"id": "n_eead9f745e", "title": "3.置信度筛选+NMS后处理", "level": 5, "children": []}]}]}, {"id": "n_60e4f85e8f", "title": "YOLOv2", "level": 3, "children": [{"id": "n_b879c77764", "title": "主要特点", "level": 4, "children": [{"id": "n_d6e63bae81", "title": "YOLOv2相对v1版本，在继续保持处理速度的基础上，从预测更准确（Better），速度更快（Faster），识别对象更多（Stronger）这三个方面进行了改进。其中识别更多对象也就是扩展到能够检测9000种不同对象，称之为YOLO9000。", "level": 5, "children": [{"id": "n_336f51ba35", "title": "预测更准确（better）", "level": 6, "children": [{"id": "n_7c6c6bc5f3", "title": "batch normalization", "level": 7, "children": []}, {"id": "n_034ec41d39", "title": "使用高分辨率图像微调分类模型", "level": 7, "children": [{"id": "n_2b8292a2f9", "title": "224预训练，448微调（10epoch）", "level": 8, "children": []}]}, {"id": "n_fc78cba5e9", "title": "采用Anchor Boxes", "level": 7, "children": []}, {"id": "n_387fa2adc9", "title": "聚类提取anchor尺度*", "level": 7, "children": [{"id": "n_c4c5cd638b", "title": "5Anchor-K-means", "level": 8, "children": []}]}, {"id": "n_66e7685509", "title": "边框位置的预测", "level": 7, "children": []}, {"id": "n_a4ef9faa28", "title": "细粒度特征融合", "level": 7, "children": [{"id": "n_1faed4df9f", "title": "passthrough", "level": 8, "children": []}, {"id": "n_3c9b67468f", "title": "局部+全局", "level": 8, "children": []}]}, {"id": "n_8a4e2d4ede", "title": "多尺度训练", "level": 7, "children": [{"id": "n_40555491ba", "title": "10种尺度", "level": 8, "children": []}]}]}, {"id": "n_0732dbfc2e", "title": "速度更快（Faster）", "level": 6, "children": [{"id": "n_39a9ca6030", "title": "提出了Darknet-19（有19个卷积层和5个MaxPooling层）网络结构作为特征提取网络。", "level": 7, "children": [{"id": "n_e37c283a07", "title": "DarkNet-19比VGG-16小一些，精度不弱于VGG-16，但浮点运算量减少到约⅕，以保证更快的运算速度。", "level": 8, "children": []}]}, {"id": "n_ae754af067", "title": "网络中只有卷积+pooling，从416x416x3 变换到 13x13x5x25。增加了batch normalization，增加了一个passthrough层，去掉了全连接层，以及采用了5个先验框,网络的输出。", "level": 7, "children": []}]}, {"id": "n_062afbc358", "title": "识别对象更多", "level": 6, "children": [{"id": "n_8d2fdd067b", "title": "YOLO2尝试利用ImageNet非常大量的分类样本，联合COCO的对象检测数据集一起训练，使得YOLO2即使没有学过很多对象的检测样本，也能检测出这些对象。", "level": 7, "children": []}]}]}]}, {"id": "n_233c4d9bb4", "title": "网络结构", "level": 4, "children": [{"id": "n_0cdb14d281", "title": "(未命名)", "le // ---------- GitHub Gist 同步配置 ----------
// 部署时替换占位符为实际值，留空则降级为纯本地存储
const GITHUB_CONFIG = {
  token: "__GITHUB_TOKEN__",   // GitHub Personal Access Token (gist 权限)
  gistId: "__GIST_ID__",       // Gist ID
  fileName: "progress.json",    // Gist 内的文件名
  apiBase: "https://api.github.com",
  enabled: false
};

GITHUB_CONFIG.enabled = !GITHUB_CONFIG.token.startsWith("__") &&
                        !GITHUB_CONFIG.gistId.startsWith("__");

// ---------- 同步状态管理 ----------
const syncStatusEl = document.getElementById("syncStatus");
const syncBtn = document.getElementById("syncBtn");
const syncToast = document.getElementById("syncToast");
let syncTimer = null;
let lastSyncTime = null;
let isSyncing = false;

function setSyncStatus(state, msg){
  syncStatusEl.className = "sync-status " + state;
  const labels = {
    idle:"未同步", syncing:"同步中…", synced:"已同步",
    failed:"同步失败", offline:"离线"
  };
  let text = labels[state] || state;
  if(state === "synced" && lastSyncTime) text = "已同步 " + lastSyncTime;
  if(state === "failed" && msg) text = "失败:" + msg.substring(0,30);
  syncStatusEl.textContent = text;
  syncStatusEl.title = msg || text;
}

function showToast(msg, ms){
  ms = ms || 3000;
  syncToast.textContent = msg;
  syncToast.classList.add("show");
  setTimeout(()=>syncToast.classList.remove("show"), ms);
}

// ---------- 从 Gist 拉取进度 ----------
async function downloadProgress(){
  const cfg = GITHUB_CONFIG;
  if(!cfg.enabled) return null;
  try{
    const headers = {
      "Accept": "application/vnd.github.v3+json",
      "User-Agent": "ai-tutor-skill"
    };
    if(cfg.token) headers["Authorization"] = "Bearer " + cfg.token;

    const resp = await fetch(cfg.apiBase + "/gists/" + cfg.gistId, {
      method: "GET",
      headers: headers
    });
    if(resp.status === 404){
      console.log("[sync] Gist 不存在");
      return null;
    }
    if(resp.status === 401 || resp.status === 403){
      console.warn("[sync] Token 无效或权限不足");
      return null;
    }
    if(!resp.ok){
      throw new Error("HTTP " + resp.status);
    }
    const data = await resp.json();
    const file = data.files && data.files[cfg.fileName];
    if(!file){
      console.log("[sync] Gist 中无 " + cfg.fileName);
      return null;
    }
    const content = file.content;
    try{
      return JSON.parse(content);
    }catch{
      // 内容可能是字符串形式的 JSON
      return JSON.parse(JSON.stringify(content));
    }
  }catch(err){
    console.warn("[sync] 下载失败:", err);
    return null;
  }
}

// ---------- 上传进度到 Gist ----------
async function uploadProgress(retries){
  retries = retries || 0;
  const cfg = GITHUB_CONFIG;
  if(isSyncing){
    console.log("[sync] 已有同步进行中，跳过");
    return false;
  }
  if(!cfg.enabled){
    console.log("[sync] 未配置 Gist，跳过");
    return false;
  }
  isSyncing = true;
  setSyncStatus("syncing");
  try{
    const body = {
      files: {}
    };
    body.files[cfg.fileName] = {
      content: JSON.stringify(progress, null, 2)
    };

    const headers = {
      "Accept": "application/vnd.github.v3+json",
      "User-Agent": "ai-tutor-skill",
      "Content-Type": "application/json",
      "Authorization": "Bearer " + cfg.token
    };

    const resp = await fetch(cfg.apiBase + "/gists/" + cfg.gistId, {
      method: "PATCH",
      headers: headers,
      body: JSON.stringify(body)
    });

    if(!resp.ok){
      const txt = await resp.text();
      throw new Error("HTTP " + resp.status + ": " + txt.substring(0,200));
    }
    lastSyncTime = new Date().toLocaleTimeString();
    setSyncStatus("synced");
    console.log("[sync] 上传成功");
    return true;
  }catch(err){
    console.error("[sync] 上传失败:", err);
    if(retries < 2){
      const delay = Math.pow(2, retries) * 1000;
      console.log("[sync] " + delay + "ms 后重试 (" + (retries+1) + "/3)");
      setSyncStatus("syncing", "重试中");
      await new Promise(function(r){ setTimeout(r, delay); });
      isSyncing = false;
      return uploadProgress(retries + 1);
    }
    setSyncStatus("failed", err.message);
    showToast("同步失败：" + err.message + "（本地已保存）");
    return false;
  }finally{
    isSyncing = false;
  }
}

// ---------- 防抖同步 ----------
function scheduleSync(){
  if(!GITHUB_CONFIG.enabled) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    uploadProgress();
  }, 3000);
}

// ---------- 合并远程进度（远程优先，本地新增保留） ----------
function mergeProgress(local, remote){
  if(!remote || typeof remote !== "object") return local;
  return Object.assign({}, remote, local);
}

// ---------- 初始化：从远程拉取进度 ----------
async function initRemoteSync(){
  if(!GITHUB_CONFIG.enabled){
    setSyncStatus("offline", "未配置 GitHub Gist，仅本地存储");
    return;
  }
  setSyncStatus("syncing", "拉取中…");
  const remote = await downloadProgress();
  if(remote){
    progress = mergeProgress(progress, remote);
    saveProgress();
    rerender();
    setSyncStatus("synced", "已从 Gist 同步");
    showToast("已从云端同步进度");
  }else{
    setSyncStatus("idle", "远程无进度，本地为主");
  }
}

// ---------- 手动同步按钮 ----------
syncBtn.addEventListener("click", async function(){
  if(!GITHUB_CONFIG.enabled){
    showToast("GitHub Gist 未配置，请检查 GITHUB_CONFIG");
    return;
  }
  showToast("正在同步…", 1500);
  const ok = await uploadProgress();
  if(ok) showToast("同步成功");
});


// ---------- 进度状态（localStorage 持久化）----------
const LS_KEY = "ai-tutor-progress-v1";
let progress = loadProgress();

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }
  catch{ return {}; }
}
function saveProgress(){
  localStorage.setItem(LS_KEY, JSON.stringify(progress));
  scheduleSync();
}
function getNodeState(id){
  return progress[id] || {learned:false, reviewCount:0, lastReview:null, important:false, notes:""};
}
function setNodeState(id, st){ progress[id] = st; saveProgress(); updateStats(); }

// ---------- 渲染 ----------
const treeWrap = document.getElementById("treeWrap");
const filterSel = document.getElementById("filter");
const searchInput = document.getElementById("search");

function stateClass(st){
  if(!st.learned) return "state-unlearned";
  const r = st.reviewCount;
  if(r===0) return "state-learned";
  if(r<=2) return "state-r1";
  if(r<=4) return "state-r3";
  return "state-r4";
}
function badgeClass(st){
  if(!st.learned) return "r0";
  const r = st.reviewCount;
  if(r<=2) return "r1";
  if(r<=4) return "r3";
  return "r4";
}

function renderNode(node, depth, maxDepth, stageId){
  const st = getNodeState(node.id);
  const hasChildren = node.children && node.children.length>0;
  const li = document.createElement("li");
  li.className = "tree-li";
  const row = document.createElement("div");
  row.className = "node " + stateClass(st) + (st.important ? " important" : "");
  row.dataset.id = node.id;
  row.dataset.title = node.title;
  row.dataset.state = st.learned ? (st.reviewCount>=5?"mastered":"learned") : "unlearned";

  // 箭头
  const arrow = document.createElement("span");
  arrow.className = "arrow " + (hasChildren ? (depth>=maxDepth ? "collapsed" : "expanded") : "empty");
  row.appendChild(arrow);

  // 已学习复选框
  const chk = document.createElement("input");
  chk.type = "checkbox";
  chk.className = "chk";
  chk.checked = st.learned;
  chk.title = "标记已学习（含子节点批量标记）";
  chk.addEventListener("change", ()=>{
    const s = getNodeState(node.id);
    s.learned = chk.checked;
    if(s.learned && !s.lastReview) s.lastReview = new Date().toISOString().slice(0,10);
    setNodeState(node.id, s);
    // 批量标记所有子节点
    if(hasChildren){
      walkNodes(node.children, c=>{
        const cs = getNodeState(c.id);
        cs.learned = chk.checked;
        if(cs.learned && !cs.lastReview) cs.lastReview = new Date().toISOString().slice(0,10);
        setNodeState(c.id, cs);
      });
    }
    rerender();
  });
  row.appendChild(chk);

  // 复习+1 按钮
  const revBtn = document.createElement("button");
  revBtn.className = "review-btn";
  revBtn.textContent = "复习+1";
  revBtn.title = "复习次数+1（Shift+点击重置为0）";
  revBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    const s = getNodeState(node.id);
    if(e.shiftKey){ s.reviewCount = 0; }
    else{ s.reviewCount = (s.reviewCount||0)+1; s.learned = true; s.lastReview = new Date().toISOString().slice(0,10); }
    setNodeState(node.id, s);
    rerender();
  });
  row.appendChild(revBtn);

  // 标题
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = node.title;
  title.title = "双击标记重要；单击折叠/展开";
  title.addEventListener("dblclick", (e)=>{
    e.stopPropagation();
    const s = getNodeState(node.id);
    s.important = !s.important;
    setNodeState(node.id, s);
    rerender();
  });
  row.appendChild(title);

  // 复习徽章
  if(st.learned && st.reviewCount>0){
    const badge = document.createElement("span");
    badge.className = "badge " + badgeClass(st);
    badge.textContent = "复习" + st.reviewCount;
    row.appendChild(badge);
  }

  // 元信息
  if(node.source_date){
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = node.source_date;
    row.appendChild(meta);
  }

  li.appendChild(row);

  // 子节点
  if(hasChildren){
    const ul = document.createElement("ul");
    ul.className = "tree";
    ul.dataset.depth = depth+1;
    const show = depth < maxDepth;
    ul.style.display = show ? "" : "none";
    for(const c of node.children){
      ul.appendChild(renderNode(c, depth+1, maxDepth, stageId));
    }
    li.appendChild(ul);
    arrow.addEventListener("click", (e)=>{
      e.stopPropagation();
      const expanded = ul.style.display !== "none";
      ul.style.display = expanded ? "none" : "";
      arrow.className = "arrow " + (expanded ? "collapsed" : "expanded");
    });
    // 标题也触发折叠
    title.addEventListener("click", (e)=>{
      if(e.detail === 1){
        const expanded = ul.style.display !== "none";
        ul.style.display = expanded ? "none" : "";
        arrow.className = "arrow " + (expanded ? "collapsed" : "expanded");
      }
    });
  }
  return li;
}

function walkNodes(nodes, fn){
  for(const n of nodes){
    fn(n);
    if(n.children && n.children.length) walkNodes(n.children, fn);
  }
}

function renderTree(maxDepth){
  treeWrap.innerHTML = "";
  for(const stage of KNOWLEDGE.stages){
    const block = document.createElement("div");
    block.className = "stage-block";
    const header = document.createElement("div");
    header.className = "stage-header";
    const arrow = document.createElement("span");
    arrow.className = "arrow expanded";
    header.appendChild(arrow);
    const title = document.createElement("span");
    title.textContent = stage.stage_name;
    header.appendChild(title);
    const meta = document.createElement("span");
    meta.className = "stage-meta";
    const total = countStageNodes(stage);
    const learned = countStageLearned(stage);
    meta.textContent = `${learned}/${total} · ${total?Math.round(learned/total*100):0}%`;
    header.appendChild(meta);
    const pb = document.createElement("div");
    pb.className = "progress-bar";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = (total?learned/total*100:0)+"%";
    pb.appendChild(fill);
    header.appendChild(pb);
    block.appendChild(header);

    const body = document.createElement("div");
    body.className = "stage-body";
    const ul = document.createElement("ul");
    ul.className = "tree";
    for(const root of stage.knowledge_tree){
      ul.appendChild(renderNode(root, 0, maxDepth, stage.stage_id));
    }
    body.appendChild(ul);
    block.appendChild(body);

    header.addEventListener("click", ()=>{
      const expanded = body.style.display !== "none";
      body.style.display = expanded ? "none" : "";
      arrow.className = "arrow " + (expanded ? "collapsed" : "expanded");
    });
    block.dataset.stageId = stage.stage_id;
    treeWrap.appendChild(block);
  }
  applyFilter();
  updateStats();
}

function countStageNodes(stage){
  let n=0;
  for(const root of stage.knowledge_tree) walkNodes([root], ()=>n++);
  return n;
}
function countStageLearned(stage){
  let n=0;
  for(const root of stage.knowledge_tree) walkNodes([root], c=>{ if(getNodeState(c.id).learned) n++; });
  return n;
}

// ---------- 缩放 ----------
const zoom = document.getElementById("zoom");
const zoomVal = document.getElementById("zoomVal");
zoom.addEventListener("input", ()=>{
  const v = parseInt(zoom.value);
  treeWrap.style.transform = `scale(${v/100})`;
  treeWrap.style.width = (10000/v) + "%";
  zoomVal.textContent = v + "%";
});

// ---------- 展开/折叠层级 ----------
document.querySelectorAll(".toolbar button[data-level]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const lvl = btn.dataset.level;
    let d = lvl==="all" ? 999 : parseInt(lvl);
    renderTree(d);
  });
});

// ---------- 搜索与筛选 ----------
function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  const f = filterSel.value;
  document.querySelectorAll(".node").forEach(row=>{
    let visible = true;
    if(q){
      visible = row.dataset.title.toLowerCase().includes(q);
    }
    if(visible && f!=="all"){
      const st = getNodeState(row.dataset.id);
      if(f==="unlearned") visible = !st.learned;
      else if(f==="learned") visible = st.learned;
      else if(f==="need-review") visible = st.learned && st.reviewCount<3;
      else if(f==="mastered") visible = st.reviewCount>=5;
    }
    row.classList.toggle("hidden", !visible);
    row.classList.toggle("match", q && visible);
  });
  // 隐藏没有可见子节点的空分组
  document.querySelectorAll(".stage-block").forEach(block=>{
    const hasVisible = block.querySelectorAll(".node:not(.hidden)").length>0;
    block.style.display = hasVisible ? "" : "none";
  });
}
searchInput.addEventListener("input", applyFilter);
filterSel.addEventListener("change", applyFilter);

// ---------- 统计 ----------
function updateStats(){
  let total=0, learned=0, reviewSum=0, mastered=0, important=0;
  for(const stage of KNOWLEDGE.stages){
    for(const root of stage.knowledge_tree){
      walkNodes([root], c=>{
        total++;
        const st = getNodeState(c.id);
        if(st.learned){ learned++; reviewSum += st.reviewCount||0; }
        if(st.reviewCount>=5) mastered++;
        if(st.important) important++;
      });
    }
  }
  const pct = total ? Math.round(learned/total*100) : 0;
  const avgReview = learned ? (reviewSum/learned).toFixed(1) : "0";
  document.getElementById("globalStats").textContent =
    `已学 ${learned}/${total} · ${pct}% · 掌握${mastered} · 重要${important}`;
  document.getElementById("floatStats").innerHTML = `
    <div class="row"><span class="label">知识点总数</span><span class="val">${total}</span></div>
    <div class="row"><span class="label">已学习</span><span class="val">${learned} (${pct}%)</span></div>
    <div class="row"><span class="label">已掌握(≥5次)</span><span class="val">${mastered}</span></div>
    <div class="row"><span class="label">平均复习</span><span class="val">${avgReview} 次</span></div>
    <div class="row"><span class="label">重要标记</span><span class="val">${important}</span></div>
    <div class="row"><span class="label">更新时间</span><span class="val">${new Date().toLocaleString()}</span></div>
  `;
}

// ---------- 导出/导入/复制 ----------
function buildExport(){
  return {
    exported_at: new Date().toISOString(),
    progress: progress,
    stats: (function(){
      let total=0,learned=0,mastered=0,reviewSum=0;
      for(const stage of KNOWLEDGE.stages)
        for(const root of stage.knowledge_tree)
          walkNodes([root], c=>{
            total++;
            const st=getNodeState(c.id);
            if(st.learned){learned++; reviewSum+=st.reviewCount||0;}
            if(st.reviewCount>=5) mastered++;
          });
      return {total, learned, mastered, coverage: total?Math.round(learned/total*100):0, avg_review: learned?(reviewSum/learned).toFixed(2):0};
    })()
  };
}
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const data = buildExport();
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `progress_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("copyBtn").addEventListener("click", async ()=>{
  const data = buildExport();
  try{
    await navigator.clipboard.writeText(JSON.stringify(data,null,2));
    alert("进度 JSON 已复制到剪贴板，可粘贴给 AI 导师");
  }catch{
    prompt("请手动复制：", JSON.stringify(data));
  }
});
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const p = data.progress || data;
      progress = Object.assign({}, progress, p);
      saveProgress();
      rerender();
      alert("导入成功");
    }catch(err){ alert("导入失败：" + err.message); }
  };
  reader.readAsText(file);
});

function rerender(){ renderTree(currentMaxDepth); }
let currentMaxDepth = 2;
const origRender = renderTree;
renderTree = function(d){ currentMaxDepth = d; origRender(d); };

// ---------- 初始化 ----------
renderTree(2);
initRemoteSync();
</script>
</body>
</html>
